name: Tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv pip install \
            numpy \
            scipy \
            open3d==0.18.0 \
            matplotlib \
            pytest \
            -r range_scanner/requirements.txt

      - name: Run tests
        run: uv run pytest tests/ -v
